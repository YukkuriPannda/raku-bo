services:
  backend:
    build:
      context: ./backend
    ports:
      - "8787:8787"
    env_file:
      - path: ./backend/.dev.vars
        required: false
    environment:
      WRANGLER_SEND_METRICS: "false"
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./web
    ports:
      - "5173:5173"
    env_file:
      - path: ./web/.env
        required: false
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - web_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_modules:
  web_modules:
